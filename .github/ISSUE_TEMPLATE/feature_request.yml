name: ✨ Feature idea
description: Suggest an improvement to CareCircle
title: '[Feature]: '
labels:
- enhancement
body:
- type: textarea
  id: problem
  attributes:
    label: Problem
    description: What is hard or missing today?
  validations:
    required: true
- type: textarea
  id: idea
  attributes:
    label: Proposed solution
  validations:
    required: true
- type: dropdown
  id: areas
  attributes:
    label: Area
    multiple: true
    options:
    - MCP tools
    - Dose logging & double-dose guard
    - Missed-dose / refill alerts (SNS)
    - Daily digests & translations
    - AWS deployment (SAM template)
    - Other
- type: checkboxes
  id: help
  attributes:
    label: Contribution
    options:
    - label: I'd like to help build this
